<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>Login / Signup - Trade Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
  <div class="bg-slate-800 p-8 rounded-xl border border-slate-700 w-full max-w-md shadow-2xl">
    <h2 id="title" class="text-2xl font-bold text-center mb-6 text-emerald-400">Member Login</h2>

    <div class="space-y-4">
      <div id="nameBox" class="hidden">
        <label class="block text-sm text-slate-400 mb-1">Name</label>
        <input type="text" id="name" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white outline-none focus:border-emerald-500">
      </div>
      <div>
        <label class="block text-sm text-slate-400 mb-1">Email</label>
        <input type="email" id="email" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white outline-none focus:border-emerald-500">
      </div>
      <div>
        <label class="block text-sm text-slate-400 mb-1">Password</label>
        <input type="password" id="password" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white outline-none focus:border-emerald-500">
      </div>

      <button id="submitBtn" onclick="handleSubmit()" class="w-full bg-emerald-500 hover:bg-emerald-600 font-semibold py-2.5 rounded-lg transition mt-2">
        Login Karein
      </button>

      <p class="text-sm text-center text-slate-400 mt-4">
        <span id="toggleText">Naye member hain?</span> 
        <button onclick="toggleMode()" class="text-emerald-400 underline font-medium ml-1" id="toggleBtn">Signup karein</button>
      </p>
    </div>
  </div>

  <script>
    let isLogin = true;
    function toggleMode() {
      isLogin = !isLogin;
      document.getElementById('title').innerText = isLogin ? 'Member Login' : 'Naya Account Banayein';
      document.getElementById('submitBtn').innerText = isLogin ? 'Login Karein' : 'Register Karein';
      document.getElementById('nameBox').classList.toggle('hidden', isLogin);
      document.getElementById('toggleText').innerText = isLogin ? 'Naye member hain?' : 'Pehle se account hai?';
      document.getElementById('toggleBtn').innerText = isLogin ? 'Signup karein' : 'Login karein';
    }

    async function handleSubmit() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const name = document.getElementById('name').value;

      const url = isLogin ? '/api/login' : '/api/register';
      const body = isLogin ? { email, password } : { name, email, password };

      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();

      if (res.ok) {
        if (isLogin) {
          window.location.href = '/dashboard.html';
        } else {
          alert(data.message);
          toggleMode();
        }
      } else {
        alert(data.error);
      }
    }
  </script>
</body>
</html>
