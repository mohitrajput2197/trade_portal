<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Trade Portal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0f19;
    }
    .font-mono-val {
      font-family: 'JetBrains Mono', monospace;
    }
    .glass-panel {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .ambient-glow {
      position: fixed;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.15;
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body class="text-slate-100 flex items-center justify-center min-h-screen p-4 relative overflow-hidden selection:bg-emerald-500 selection:text-black">

  <!-- Ambient Glow Background -->
  <div class="ambient-glow bg-emerald-500 -top-24 -left-24"></div>
  <div class="ambient-glow bg-sky-500 -bottom-24 -right-24"></div>

  <div class="glass-panel w-full max-w-md p-8 rounded-3xl shadow-2xl space-y-6 relative z-10 border border-slate-700/80">
    
    <!-- Branding Header -->
    <div class="text-center space-y-2">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-400 text-slate-950 flex items-center justify-center mx-auto text-2xl font-bold shadow-lg shadow-emerald-500/25">
        <i class="bi bi-graph-up-arrow"></i>
      </div>
      <h2 class="text-2xl font-extrabold tracking-tight bg-gradient-to-r from-emerald-400 via-teal-300 to-sky-400 bg-clip-text text-transparent">Trade Data Portal</h2>
      <p class="text-xs text-slate-400 font-medium" id="pageSubtitle">Enter your credentials to access trading terminal</p>
    </div>

    <!-- Login Form -->
    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1.5">User ID / MCX ID</label>
        <div class="relative">
          <input type="text" id="loginEmail" required placeholder="Enter User ID" class="w-full bg-slate-950 border border-slate-700/80 rounded-xl p-3 text-sm text-white outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition font-mono-val pl-10">
          <i class="bi bi-person text-slate-500 absolute left-3.5 top-3.5 text-base"></i>
        </div>
      </div>

      <div>
        <div class="flex justify-between items-center mb-1.5">
          <label class="text-xs font-semibold text-slate-400">Password</label>
          <button type="button" onclick="openResetModal()" class="text-[11px] text-emerald-400 hover:text-emerald-300 font-semibold underline">Forgot Password?</button>
        </div>
        <div class="relative">
          <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-700/80 rounded-xl p-3 text-sm text-white outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition font-mono-val pl-10">
          <i class="bi bi-key text-slate-500 absolute left-3.5 top-3.5 text-base"></i>
        </div>
      </div>

      <button type="submit" id="loginBtn" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-bold py-3 rounded-xl transition duration-200 shadow-lg shadow-emerald-500/25 flex items-center justify-center gap-2">
        <i class="bi bi-box-arrow-in-right text-lg"></i> Login to Portal
      </button>
    </form>

    <!-- Register Form (Toggleable) -->
    <form id="registerForm" onsubmit="handleRegister(event)" class="hidden space-y-3.5 pt-2 border-t border-slate-800">
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Full Name</label>
        <input type="text" id="regName" required placeholder="Trader Name" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-sm text-white outline-none focus:border-emerald-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">User ID / MCX ID</label>
        <input type="text" id="regEmail" required placeholder="Desired User ID" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-sm text-white font-mono-val outline-none focus:border-emerald-500">
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1 flex items-center gap-1">
            <i class="bi bi-whatsapp text-emerald-400"></i> WhatsApp No.
          </label>
          <input type="text" id="regPhone" placeholder="+91..." class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-sm text-white font-mono-val outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1 flex items-center gap-1">
            <i class="bi bi-envelope text-sky-400"></i> Gmail
          </label>
          <input type="email" id="regGmail" placeholder="id@gmail.com" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-sm text-white font-mono-val outline-none focus:border-emerald-500">
        </div>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Password</label>
        <input type="password" id="regPass" required placeholder="Create Password" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-sm text-white outline-none focus:border-emerald-500">
      </div>
      <div>
        <label class="block text-xs font-bold text-amber-400 mb-1 flex items-center gap-1">
          <i class="bi bi-shield-check"></i> Office Passcode
        </label>
        <input type="password" id="regOfficeCode" required placeholder="CODE" class="w-full bg-slate-950 border border-amber-500/40 rounded-xl p-2.5 text-sm text-white outline-none focus:border-amber-400 font-mono-val">
      </div>
      <button type="submit" class="w-full bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold py-2.5 rounded-xl transition shadow-lg shadow-teal-500/25">
        Register Account
      </button>
    </form>

    <!-- Bottom Switcher -->
    <div class="text-center pt-2 border-t border-slate-800">
      <p class="text-xs text-slate-400" id="switchText">
        New to Portal? 
        <button type="button" onclick="toggleFormView()" class="text-emerald-400 font-semibold underline hover:text-emerald-300 ml-1">Create an Account</button>
      </p>
    </div>
  </div>

  <!-- Forgot / Reset Password Modal -->
  <div id="resetModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="glass-panel border border-slate-700/80 rounded-2xl p-6 w-full max-w-sm shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="text-base font-bold text-emerald-400 flex items-center gap-2">
          <i class="bi bi-key-fill"></i> Reset Password
        </h3>
        <button onclick="closeResetModal()" class="text-slate-400 hover:text-white text-xl font-bold">&times;</button>
      </div>

      <form onsubmit="handleReset(event)" class="space-y-3.5">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Your Registered User ID</label>
          <input type="text" id="resetEmail" required placeholder="Enter User ID" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-sm text-white font-mono-val outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-amber-400 mb-1">Office Passcode</label>
          <input type="password" id="resetOfficeCode" required placeholder="CODE" class="w-full bg-slate-950 border border-amber-500/40 rounded-xl p-2.5 text-sm text-white font-mono-val outline-none focus:border-amber-400">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">New Password</label>
          <input type="password" id="resetNewPass" required placeholder="Enter New Password" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-sm text-white outline-none focus:border-emerald-500">
        </div>
        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeResetModal()" class="w-1/2 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 rounded-xl text-xs font-semibold transition">Cancel</button>
          <button type="submit" class="w-1/2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 py-2.5 rounded-xl text-xs font-bold transition">Update Password</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let isRegisterView = false;

    function toggleFormView() {
      isRegisterView = !isRegisterView;
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const subtitle = document.getElementById('pageSubtitle');
      const switchText = document.getElementById('switchText');

      if (isRegisterView) {
        loginForm.classList.add('hidden');
        registerForm.classList.remove('hidden');
        subtitle.innerText = 'Create your new trader portal account';
        switchText.innerHTML = `Already have an account? <button type="button" onclick="toggleFormView()" class="text-emerald-400 font-semibold underline hover:text-emerald-300 ml-1">Login here</button>`;
      } else {
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
        subtitle.innerText = 'Enter your credentials to access trading terminal';
        switchText.innerHTML = `New to Portal? <button type="button" onclick="toggleFormView()" class="text-emerald-400 font-semibold underline hover:text-emerald-300 ml-1">Create an Account</button>`;
      }
    }

    // Login Action
    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        if (res.ok) {
          window.location.href = '/dashboard.html';
        } else {
          alert('Error: ' + (data.error || 'Login failed'));
        }
      } catch (err) {
        alert('Server se connect karne me problem aayi.');
      }
    }

    // Register Action
    async function handleRegister(e) {
      e.preventDefault();
      const body = {
        name: document.getElementById('regName').value.trim(),
        email: document.getElementById('regEmail').value.trim(),
        phone: document.getElementById('regPhone').value.trim(),
        gmail: document.getElementById('regGmail').value.trim(),
        password: document.getElementById('regPass').value,
        office_code: document.getElementById('regOfficeCode').value.trim()
      };

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        const data = await res.json();
        alert(data.message || data.error);
        if (res.ok) {
          toggleFormView();
          document.getElementById('loginEmail').value = body.email;
        }
      } catch (err) {
        alert('Server error while registering.');
      }
    }

    // Reset Password Action
    function openResetModal() { document.getElementById('resetModal').classList.remove('hidden'); }
    function closeResetModal() { document.getElementById('resetModal').classList.add('hidden'); }

    async function handleReset(e) {
      e.preventDefault();
      const body = {
        email: document.getElementById('resetEmail').value.trim(),
        office_code: document.getElementById('resetOfficeCode').value.trim(),
        new_password: document.getElementById('resetNewPass').value
      };

      try {
        const res = await fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        const data = await res.json();
        alert(data.message || data.error);
        if (res.ok) {
          closeResetModal();
          document.getElementById('loginEmail').value = body.email;
        }
      } catch (err) {
        alert('Error connecting to reset API.');
      }
    }
  </script>
</body>
</html>
